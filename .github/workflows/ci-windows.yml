name: CI - Windows

# The Windows port's gate, beside the upstream ubuntu job in ci.yml (which also
# runs on `windows`, for the zero mac/linux regression rule). A file of its own,
# so an upstream sync never has to merge into it.
on:
  pull_request:
    branches: [windows]
  push:
    branches: [windows]
  workflow_dispatch:
  # The upstream sync (upstream-sync.yml) runs this gate on its merge before
  # windows moves. It passes the merge as `ref`: a called workflow's github
  # context is the caller's, so a bare checkout would test windows as it was.
  workflow_call:
    inputs:
      ref:
        description: The commit to test (default, the triggering ref)
        type: string
        default: ''
      e2e_only:
        description: Skip the unit job, for the sync's one retry of a failed e2e job
        type: boolean
        default: false
    outputs:
      unit:
        description: Result of the unit job (success, failure, cancelled, skipped)
        value: ${{ jobs.unit.result }}
      e2e:
        description: Result of the e2e job
        value: ${{ jobs.e2e.result }}

permissions:
  contents: read

# Keyed on the commit a sync passes, so a sync's gate and a push to windows
# never cancel each other.
concurrency:
  group: ci-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Checks and unit tests (windows-latest)
    if: ${{ !inputs.e2e_only }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # The repo has no .gitattributes, and the runner's git converts to CRLF by
      # default: the .sh hooks and the tests that read them are LF-sensitive.
      # Must run before the checkout, which is when the files are written.
      - name: Keep line endings and long paths as committed
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # One command per step: pwsh on the runner exits with the step's last
      # native exit code only, so a chain would hide an earlier failure.
      - name: Install dependencies
        run: npm ci

      - name: Type check (renderer)
        run: npx tsc --noEmit

      - name: Type check and build (main process)
        run: npx tsc -p electron/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Design lint
        run: npm run lint:design

      - name: No em or en dashes
        run: npm run check:dashes

      - name: E2E coverage guard
        run: npm run e2e:guard

      # The harness (__tests__/setup) moves HOME, USERPROFILE and APPDATA into a
      # run directory. The runner's account may create symlinks, so the tests
      # that skip without that privilege on a workstation run here.
      - name: Run tests
        run: npm test

  e2e:
    name: E2E (windows-latest)
    needs: unit
    # After a green unit job, or alone when the sync retries a failed e2e job.
    if: ${{ !cancelled() && (needs.unit.result == 'success' || (inputs.e2e_only && needs.unit.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Keep line endings and long paths as committed
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm ci leaves the Electron binary to its first use; fetch it up front.
      - name: Install the Electron binary
        run: npx install-electron

      # Nothing in the E2E path compiles the main process (OPERATIONS.md).
      - name: Build the main process
        run: npx tsc -p electron/tsconfig.json

      # The screenshot specs (every test titled `surface: <name>`) compare
      # against e2e/__screenshots__/win32/. Until those references are recorded
      # they would all fail on a missing file, so they are left out, and the
      # rest of the suite runs. Once the folder is committed, the whole suite
      # runs with no edit here.
      - name: Run E2E
        shell: bash
        run: |
          if [ -d e2e/__screenshots__/win32 ]; then
            echo "win32 references present: full suite"
            npx playwright test
          else
            echo "no e2e/__screenshots__/win32 yet: screenshot specs left out"
            npx playwright test --grep-invert "surface: "
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: e2e/report/
          retention-days: 14

      - name: Upload the run artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runs-windows
          path: test-results/runs/**
          retention-days: 14
