name: Upstream sync

# Decision D13: every day, merge JeanBrasse/Tars main into windows, gate the
# merge with the whole CI (ubuntu and windows-latest), and when every job is
# green fast-forward windows to it and cut a Windows release, so installed
# builds update. sync-upstream.ps1 is the manual equivalent.
#
# REQUIRED: the fork's default branch must be `windows` (Settings > General >
# Default branch). GitHub fires a schedule, and shows the Run workflow button,
# only for a workflow file on the default branch; main mirrors upstream and
# never carries this file, not even as a stub.
#
# Why one workflow and no pull request: a push or a PR made with the default
# GITHUB_TOKEN starts no other workflow (docs.github.com/en/actions/concepts/
# security/github_token), and auto-merge needs a protected branch with required
# checks. So the gate is called here, as reusable workflows, on the merge
# itself, and windows only moves once they pass.
#
# The git steps live in .github/scripts/upstream-sync.sh. Nothing is ever
# force-pushed, the upstream is fetched only, and main is only ever
# fast-forwarded to upstream/main (the mirror).
#
# Pushes use the SYNC_TOKEN secret when there is one, else GITHUB_TOKEN. The
# GITHUB_TOKEN has no `workflows` permission: a sync whose upstream commits
# change a file under .github/workflows/ is refused at the push, and needs
# SYNC_TOKEN (a fine-grained token on this repository with Contents and
# Workflows read and write) or a manual sync-upstream.ps1.
#
# Actions are pinned by commit SHA, the tag in a comment: three jobs here hold
# a token that can push (mirror-main, prepare, promote) and one calls a release.
# Only those three keep credentials in .git/config; every other checkout sets
# persist-credentials: false.
on:
  schedule:
    # 04:17 UTC: off the top of the hour, when GitHub delays scheduled runs.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

# One sync at a time, and a sync is never cancelled half way.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  mirror-main:
    name: Mirror main to upstream/main (fast-forward only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fast-forward main
        run: bash .github/scripts/upstream-sync.sh mirror-main

  prepare:
    name: Merge upstream/main into a sync branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      state: ${{ steps.sync.outputs.state }}
      sha: ${{ steps.sync.outputs.sha }}
      branch: ${{ steps.sync.outputs.branch }}
      base: ${{ steps.sync.outputs.base }}
      upstream: ${{ steps.sync.outputs.upstream }}
      conflicts: ${{ steps.sync.outputs.conflicts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge
        id: sync
        env:
          BASE_BRANCH: windows
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash .github/scripts/upstream-sync.sh prepare

  conflict:
    name: Report the conflict
    needs: prepare
    if: needs.prepare.outputs.state == 'conflict'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Upstream file names reach the issue through the environment, never
      # through the script text.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: windows
          SYNC_CONFLICTS: ${{ needs.prepare.outputs.conflicts }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.branch }}
          SYNC_BASE_SHA: ${{ needs.prepare.outputs.base }}
          SYNC_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
        run: bash .github/scripts/upstream-sync.sh report-conflict

  # The gate runs the ci.yml and ci-windows.yml of the commit this run started
  # from (windows before the merge), not the ones the merge brings: `uses:`
  # takes no expression. An upstream change to those files is enforced from
  # the next sync on.
  gate-ubuntu:
    name: Gate (ubuntu)
    needs: prepare
    if: needs.prepare.outputs.state == 'merged'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  gate-windows:
    name: Gate (windows)
    needs: prepare
    if: needs.prepare.outputs.state == 'merged'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # One automatic retry when the windows gate failed (the known acp-delegation
  # ECONNRESET flake), on fresh runners. No spec is ignored.
  #   unit passed, e2e failed      rerun e2e alone (e2e_only)
  #   unit failed                  no retry: the sync stops
  #   no outputs (a failed called  rerun the whole windows gate, unit then e2e,
  #   workflow may leave them       since nothing says the unit job passed
  #   empty)
  # promote needs this retry to succeed; a rerun whose unit job fails fails.
  gate-windows-retry:
    name: Gate (windows, retry)
    needs: [prepare, gate-windows]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.state == 'merged'
      && needs.gate-windows.result == 'failure'
      && needs.gate-windows.outputs.unit != 'failure' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      e2e_only: ${{ needs.gate-windows.outputs.unit == 'success' }}

  promote:
    name: Fast-forward windows to the merge
    needs: [prepare, gate-ubuntu, gate-windows, gate-windows-retry]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.state == 'merged'
      && needs.gate-ubuntu.result == 'success'
      && (needs.gate-windows.result == 'success' || needs.gate-windows-retry.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Push the merge to windows
        id: promote
        env:
          BASE_BRANCH: windows
          SYNC_SHA: ${{ needs.prepare.outputs.sha }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: bash .github/scripts/upstream-sync.sh promote

  release:
    name: Windows release
    needs: promote
    if: needs.promote.result == 'success' && needs.promote.outputs.sha != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    with:
      sha: ${{ needs.promote.outputs.sha }}
